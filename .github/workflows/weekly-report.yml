name: Weekly Hematology Report

on:
  schedule:
    - cron: '0 0 * * 5'   # Friday 00:00 UTC = Friday 08:00 Taipei (UTC+8)
  workflow_dispatch:        # allow manual trigger from GitHub Actions UI

permissions:
  contents: write           # needed to commit reports/ back to the repo

jobs:
  weekly-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Collect data — malignant mode
        env:
          PYTHONUTF8: "1"
          ELSEVIER_API_KEY: ${{ secrets.ELSEVIER_API_KEY }}
        run: |
          uv run python main.py scrape   -m malignant
          uv run python main.py journals -m malignant

      - name: Collect data — benign mode
        env:
          PYTHONUTF8: "1"
          ELSEVIER_API_KEY: ${{ secrets.ELSEVIER_API_KEY }}
        run: |
          uv run python main.py scrape   -m benign
          uv run python main.py journals -m benign

      - name: Generate reports
        env:
          PYTHONUTF8: "1"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: uv run python scripts/generate_report.py

      - name: Build manifest
        run: uv run python scripts/build_manifest.py

      - name: Commit reports + manifest to repository
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/ manifests/
          # Double quotes outside, single quotes inside Python — no escaping needed.
          # The previous form nested \" inside a single-quoted string, so Python
          # received literal backslashes, died with SyntaxError, and every commit
          # message lost its week label.
          WEEK=$(python -c "from datetime import date; d=date.today(); print(f'{d.year}-W{d.isocalendar()[1]:02d}')")
          git diff --staged --quiet || git commit -m "report: weekly $WEEK"
          git push

# NOTE: there was a "Notify lcchema-hub" step here that fired a repository_dispatch
# (report-published) at lcchema-hub. Removed 2026-08-17 as dead code.
#
# lcchema-hub was simplified to a client-side fetch on 2026-05-20 (hub commit
# 6e487e8, "Simplify hub to client-side fetch — no build pipeline"). Its
# public/index.html now reads
#   https://raw.githubusercontent.com/lcchang224/hematology-uptodate/main/manifests/latest.json
# directly in the browser, so pushing manifests/ to main above is all the hub needs.
# Nothing listens for report-published — lcchema-hub has no workflows at all.
#
# The step had also never worked: HUB_DISPATCH_TOKEN was never set as a secret, so
# every run got 401 Bad credentials, and `curl -sS` without -f exits 0 on an HTTP
# error, which kept the job green and hid it.
